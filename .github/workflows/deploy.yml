# Build, test and deploy the Platform app to Azure App Service.
#
# One App Service hosts both the API and the built SPA (same origin — the
# frontend calls relative /api/... paths). The frontend build is copied into
# Platform.Api/wwwroot before `dotnet publish`; Program.cs serves it only when
# wwwroot/index.html exists.
#
# One-time setup (see the PR/commit that added this file):
#   Repository variables:  AZURE_WEBAPP_NAME
#   Repository secrets:    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     (a Microsoft Entra app registration with a federated credential for this
#      repo's "production" environment — no long-lived Azure password stored here)
#   GitHub environment:    "production" (optionally with required reviewers)
#
# App settings (Jwt__Key, ConnectionStrings__PlatformDB, Storage__R2__*, …)
# live in the App Service configuration, never in this repo or this workflow.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  API_PROJECT: backend/src/Platform.Api/Platform.Api.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ── Frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run

      # Every screen — entry screens (sign in, apply, invitations, password reset, ...) and every
      # owner/learner/admin screen inside the app — x EN/AR x light/dark: axe (WCAG 2.1 AA, incl.
      # contrast) must be clean and no English may remain on an Arabic screen. API responses are
      # stubbed/replayed from recordings, so this needs only a browser, not the backend.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Screen audit (language, theme, accessibility)
        working-directory: frontend
        run: npm run test:audit

      # `npm run lint` currently reports 14 pre-existing errors; add it here
      # once those are cleared so it can gate deploys.

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Backend ──────────────────────────────────────────────────────────
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Domain tests
        run: dotnet test backend/src/Platform.Domain.Tests/Platform.Domain.Tests.csproj -c Release

      # Testcontainers starts a throwaway Postgres in the runner's Docker.
      # The live-R2 tests skip themselves because no R2 credentials are given.
      - name: API integration tests
        run: dotnet test backend/src/Platform.Api.IntegrationTests/Platform.Api.IntegrationTests.csproj -c Release

      - name: Copy frontend build into API wwwroot
        run: |
          rm -rf backend/src/Platform.Api/wwwroot
          cp -r frontend/dist backend/src/Platform.Api/wwwroot

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish

      # Azure App Service (Linux)'s .NET runtime container has no system ffmpeg, and can't be
      # customized to add one without switching to a custom container image. Rather than
      # downloading it at app *runtime* (a moving target, and a startup-time dependency on an
      # external host being up), a specific, version-pinned build is downloaded and
      # checksum-verified here at *build* time and published alongside the app instead —
      # appsettings.Production.json's Transcription:FfmpegPath points at this exact path.
      #
      # Source: BtbN/FFmpeg-Builds (github.com/BtbN/FFmpeg-Builds/releases) — a dated release tag
      # (not the repo's own "latest" release, which moves), each one kept indefinitely rather
      # than pruned to "recent" like the previous source (johnvansickle.com) turned out to be,
      # which is exactly why this changed: that pinned URL would eventually 404 as older builds
      # aged out. LGPL build, not GPL — no GPL-licensed codec (libx264 etc.) is needed for audio
      # extraction, and LGPL is the more conservative choice for a binary redistributed alongside
      # this app. "linux64" (x86-64) matches Azure App Service Linux's container architecture.
      #
      # Pin bumps: update FFMPEG_URL and FFMPEG_SHA256 together, never one alone — an updated URL
      # with a stale checksum fails every build, which is the point of this check (a checksum
      # fetched fresh from the same source at build time would defeat "pinned": it would verify a
      # tampered release just as happily as a real one). Get the new checksum from that release's
      # own checksums.sha256 asset when bumping.
      - name: Download and verify pinned ffmpeg (Linux x64 build)
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-29-13-10/ffmpeg-n8.1.3-6-gff48edd8b2-linux64-lgpl-8.1.tar.xz
          FFMPEG_SHA256: 0c163fdde00e1d31cf8c44d6e27f24df46eed1b5c32c1fb177adccbf01242f33
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ffmpeg-extract
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
          mkdir -p publish/tools
          cp /tmp/ffmpeg-extract/bin/ffmpeg publish/tools/ffmpeg
          chmod +x publish/tools/ffmpeg
          publish/tools/ffmpeg -version

      - name: Check the SPA made it into the package
        run: test -f publish/wwwroot/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: platform-app
          path: publish
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write   # OIDC login to Azure
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platform-app
          path: publish

      # Belt-and-suspenders: artifact upload/download round-trips have a history of not always
      # preserving the Unix executable bit reliably — reassert it here rather than trust it
      # survived, since a non-executable ffmpeg fails the same way a missing one does.
      - name: Ensure the published ffmpeg is executable
        run: chmod +x publish/tools/ffmpeg

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      # The app runs migrations and seeding on startup; wait for it to come up
      # healthy so a failed boot (missing secret, bad migration) fails this run.
      - name: Wait for /health
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/health"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url"; then echo; echo "Healthy"; exit 0; fi
            sleep 10
          done
          echo "App did not report healthy within 5 minutes: $url"
          exit 1
